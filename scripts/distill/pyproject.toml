[project]
name = "carnet-distill"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sentence-transformers==5.4.1",
  "transformers==5.6.2",
  "torch>=2.8",  # 2.8+ : roues CUDA 12.8 (Blackwell / RTX 50xx) et CPU
  "numpy>=2.0",
  "wordfreq==3.1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
